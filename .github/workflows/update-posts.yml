name: 티스토리 글 동기화

on:
  schedule:
    - cron: "17 */6 * * *"   # 6시간마다 (UTC)
  workflow_dispatch:          # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_posts.py
      - name: 바뀐 게 있으면 커밋
        run: |
          if git diff --quiet posts.json; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git commit -m "티스토리 글 동기화"
          git push
