<style>
:root{
  --accent:#22d3a6;--accent-rgb:34,211,166;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;--mono:"SF Mono","JetBrains Mono",ui-monospace,monospace;
  --menubar:26px;
}
:root,[data-theme=dark]{
  --bg:#05080d;--win:#24262d;--win-solid:#1e2026;--side:#202228;--content:#17191e;
  --bar:rgba(20,22,28,.45);--line:rgba(255,255,255,.09);--text:#ececf0;--muted:#9a9ca6;--hover:rgba(255,255,255,.08);
  --code:#0b0d12;--dock:rgba(40,42,50,.38);--menu:rgba(38,40,48,.82);--shadow:0 22px 70px rgba(0,0,0,.55),0 0 0 .5px rgba(0,0,0,.8);
}
[data-theme=light]{
  --bg:#dfe6ee;--win:#f6f6f8;--win-solid:#f6f6f8;--side:#ececef;--content:#ffffff;
  --bar:rgba(255,255,255,.4);--line:rgba(0,0,0,.1);--text:#1d1d1f;--muted:#6e6e73;--hover:rgba(0,0,0,.06);
  --code:#f3f4f6;--dock:rgba(255,255,255,.35);--menu:rgba(240,240,243,.85);--shadow:0 22px 70px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.4 var(--font);user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:default}
#wall{position:fixed;inset:0;width:100%;height:100%}
#desktop{position:fixed;inset:var(--menubar) 0 0 0}
.blur{backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%)}

/* ===== menu bar ===== */
#menubar{position:fixed;top:0;left:0;right:0;height:var(--menubar);background:var(--bar);display:flex;align-items:center;padding:0 8px;z-index:9000;font-size:13px;color:var(--text)}
[data-theme=dark] #menubar{color:#fff}
#menubar .mi{padding:0 9px;height:22px;border-radius:5px;display:flex;align-items:center;white-space:nowrap}
#menubar .mi:hover,#menubar .mi.on{background:rgba(255,255,255,.22)}
[data-theme=light] #menubar .mi:hover,[data-theme=light] #menubar .mi.on{background:rgba(0,0,0,.1)}
#menubar .app{font-weight:700}
#menubar .sp{flex:1}
#mbClock{font-variant-numeric:tabular-nums}
.drop{position:fixed;top:calc(var(--menubar) + 2px);min-width:230px;padding:5px;background:var(--menu);border:.5px solid var(--line);border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.35);z-index:9600;display:none;font-size:13px}
.drop.open{display:block}
.drop button{display:flex;justify-content:space-between;gap:24px;width:100%;padding:3px 10px;border-radius:4px;text-align:left;line-height:1.6}
.drop button:hover:not(:disabled){background:var(--accent);color:#04110d}
.drop button:disabled{opacity:.4}
.drop kbd{font-family:var(--font);opacity:.6}
.drop button:hover kbd{opacity:.85}
.drop hr{border:0;border-top:1px solid var(--line);margin:5px 8px}
.drop .chk{width:14px;display:inline-block}

/* ===== desktop icons (right side like macOS) ===== */
.icon{position:absolute;width:92px;padding:4px;text-align:center;cursor:default}
.icon .glyph{width:58px;height:58px;margin:0 auto 3px;padding:4px;border-radius:6px;border:2px solid transparent;display:grid;place-items:center;filter:drop-shadow(0 3px 5px rgba(0,0,0,.45))}
.icon span{display:inline-block;padding:1px 5px;border-radius:4px;font-size:12px;font-weight:500;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);word-break:keep-all;line-height:1.3}
.icon.sel .glyph{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.35)}
.icon.sel span{background:var(--accent);color:#04110d;text-shadow:none}
#selbox{position:absolute;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.14);display:none;pointer-events:none;z-index:5}

/* ===== windows ===== */
.win{position:absolute;min-width:320px;min-height:200px;background:var(--win);border-radius:11px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;transform-origin:center;transition:transform .32s cubic-bezier(.3,.7,.2,1),opacity .32s}
.win.opening{animation:open .22s cubic-bezier(.2,.8,.2,1)}
@keyframes open{from{transform:scale(.92);opacity:0}}
.win.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - 0px)!important;border-radius:0}
.win.hidden{visibility:hidden;pointer-events:none}
.win:not(.focus) .tl b{background:#55575e!important}
[data-theme=light] .win:not(.focus) .tl b{background:#d0d0d3!important}
.win:not(.focus) .wtitle{opacity:.55}
.tbar{height:38px;flex:none;display:flex;align-items:center;position:relative;padding:0 12px;border-bottom:.5px solid var(--line)}
.tl{display:flex;gap:8px;z-index:2}
.tl b{width:12px;height:12px;border-radius:50%;display:grid;place-items:center;font-size:9px;line-height:1;color:transparent;font-weight:800}
.tl b.r{background:#ff5f57}.tl b.y{background:#febc2e}.tl b.g{background:#28c840}
.tl:hover b{color:rgba(0,0,0,.55)}
.wtitle{position:absolute;left:0;right:0;text-align:center;font-weight:600;font-size:13px;pointer-events:none;padding:0 90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{margin-left:auto;display:flex;gap:4px;z-index:2;align-items:center}
.wbody{flex:1;overflow:auto;position:relative;background:var(--content)}
.rz{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;z-index:3}
.tbtn{height:26px;min-width:28px;padding:0 6px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.tbtn:hover{background:var(--hover);color:var(--text)}
.tbtn.on{background:var(--hover);color:var(--text)}
.tbtn:disabled{opacity:.3}
.sfield{height:26px;width:170px;display:flex;align-items:center;gap:6px;padding:0 8px;border-radius:6px;background:var(--hover);color:var(--muted)}
.sfield input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text);font:12.5px var(--font)}

/* ===== dock ===== */
#dock{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);display:flex;align-items:flex-end;gap:2px;padding:5px 6px;height:66px;border-radius:18px;background:var(--dock);border:.5px solid rgba(255,255,255,.22);box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:8500;transition:transform .25s}
.dk{position:relative;width:52px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;transition:width .12s,height .12s;flex:none}
.dk .ico{width:100%;height:100%;border-radius:23%;overflow:hidden;transition:transform .15s}
.dk:active .ico{filter:brightness(.7)}
.dk .run{position:absolute;bottom:-5px;width:4px;height:4px;border-radius:50%;background:var(--text);opacity:0}
.dk.running .run{opacity:.85}
.dk .tip{position:absolute;bottom:calc(100% + 12px);padding:3px 10px;border-radius:6px;background:var(--menu);border:.5px solid var(--line);white-space:nowrap;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .1s}
.dk:hover .tip{opacity:1}
.dk.bounce .ico{animation:bounce .5s ease 2}
@keyframes bounce{40%{transform:translateY(-18px)}}
[data-theme=light] .dk[data-app=trash] .ico{filter:drop-shadow(0 0 1px #64748b) brightness(.85)}
.dsep{width:1px;align-self:stretch;margin:4px 5px;background:rgba(255,255,255,.3)}

/* ===== app icons (original, mac-like squircles) ===== */
.ai{width:100%;height:100%;display:grid;place-items:center}

/* ===== Finder ===== */
.finder{display:flex;height:100%}
.finder aside{width:180px;flex:none;background:var(--side);padding:10px 8px;overflow:auto;border-right:.5px solid var(--line)}
.finder aside h5{font-size:11px;color:var(--muted);font-weight:600;margin:10px 8px 4px}
.finder aside button{display:flex;align-items:center;gap:8px;width:100%;padding:4px 8px;border-radius:6px;text-align:left;font-size:13px}
.finder aside button:hover{background:var(--hover)}
.finder aside button.on{background:rgba(var(--accent-rgb),.22)}
.finder aside .tagdot{width:10px;height:10px;border-radius:50%;flex:none;margin:0 3px}
.finder .main{flex:1;display:flex;flex-direction:column;min-width:0}
.finder .grid{flex:1;overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px 6px;align-content:start}
.fi{text-align:center;padding:6px 4px;border-radius:8px}
.fi:hover{background:var(--hover)}
.fi.sel{background:rgba(var(--accent-rgb),.2)}
.fi .th{width:64px;height:78px;margin:0 auto 6px;position:relative}
.fi .nm{font-size:12px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.thumb{width:64px;height:78px;border-radius:3px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);padding:7px 6px;text-align:left;overflow:hidden;position:relative}
.thumb i{display:block;height:3px;border-radius:2px;background:#d6d8dd;margin-bottom:4px}
.thumb .tt{font-size:6.5px;line-height:1.25;font-weight:700;color:#222;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.thumb .band{position:absolute;left:0;top:0;bottom:0;width:3px}
.list{flex:1;overflow:auto}
.lrow{display:grid;grid-template-columns:1fr 110px 100px;gap:10px;align-items:center;padding:4px 14px;font-size:12.5px}
.lrow:nth-child(even):not(.lh){background:var(--hover)}
.lrow.lh{position:sticky;top:0;background:var(--content);color:var(--muted);font-size:11.5px;border-bottom:.5px solid var(--line);padding:6px 14px}
.lrow.lh span{cursor:default}.lrow.lh span:hover{color:var(--text)}
.lrow.sel{background:var(--accent)!important;color:#04110d}
.lrow .n{display:flex;gap:8px;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lrow .m{color:var(--muted)}.lrow.sel .m{color:#04110d}
.fstatus{padding:5px 14px;font-size:11.5px;color:var(--muted);border-top:.5px solid var(--line);text-align:center}
.dropzone{position:absolute;inset:8px;border:2px dashed var(--accent);border-radius:10px;background:rgba(var(--accent-rgb),.08);display:none;place-items:center;font-weight:600;color:var(--accent);z-index:4;pointer-events:none}
.dragging .dropzone{display:grid}

/* ===== post reader ===== */
.reader{display:flex;height:100%}
.reader nav{width:200px;flex:none;padding:18px 10px;border-right:.5px solid var(--line);overflow:auto;background:var(--side)}
.reader nav h5{font-size:11px;color:var(--muted);margin:0 8px 8px;font-weight:600}
.reader nav a{display:block;padding:4px 8px;border-radius:5px;font-size:12.5px;color:var(--muted);text-decoration:none;cursor:default}
.reader nav a:hover{background:var(--hover);color:var(--text)}
.reader nav a.on{color:var(--accent);font-weight:600}
.reader .scroll{flex:1;overflow:auto;position:relative}
.progress{position:absolute;top:0;left:0;height:2px;background:var(--accent);z-index:2;transition:width .1s}
.post{max-width:720px;margin:0 auto;padding:34px 40px 70px;user-select:text;-webkit-user-select:text;line-height:1.85;font-size:15px}
.post .meta{font:12px var(--mono);color:var(--accent);margin-bottom:8px}
.post h1{font-size:28px;line-height:1.3;letter-spacing:-.01em}
.post .tags{margin:12px 0 26px;display:flex;gap:6px;flex-wrap:wrap}
.post .tags span{font-size:11.5px;padding:2px 9px;border-radius:99px;background:rgba(var(--accent-rgb),.14);color:var(--accent)}
.post h2{font-size:19px;margin:32px 0 8px;scroll-margin-top:20px}
.post p,.post ul{margin:10px 0;opacity:.92}
.post ul{padding-left:22px}
.post code{font:13px var(--mono);background:var(--hover);padding:1px 6px;border-radius:5px}
.post pre{background:var(--code);border:.5px solid var(--line);border-radius:10px;padding:14px 16px;overflow:auto;margin:14px 0;position:relative}
.post pre code{background:none;padding:0;color:var(--accent);font-size:12.5px;line-height:1.7}
.post pre .cpy{position:absolute;top:8px;right:8px;font-size:11px;padding:2px 8px;border-radius:5px;background:var(--hover);color:var(--muted);opacity:0;transition:opacity .15s}
.post pre:hover .cpy{opacity:1}
.post blockquote{border-left:3px solid #febc2e;background:rgba(254,188,46,.1);padding:10px 14px;margin:16px 0;border-radius:0 8px 8px 0;font-size:14px}
.rstatus{display:flex;justify-content:space-between;padding:5px 14px;font-size:11.5px;color:var(--muted);border-top:.5px solid var(--line);background:var(--win)}

/* ===== terminal ===== */
.term{height:100%;padding:8px 12px;font:12.5px/1.55 var(--mono);background:rgba(12,14,18,.94);color:#d4d4d8;overflow:auto;cursor:text;user-select:text;-webkit-user-select:text}
[data-theme=light] .term{background:rgba(255,255,255,.96);color:#1d1d1f}
.term .ln{white-space:pre-wrap;word-break:break-all}
.term .p{color:var(--accent)}.term .e{color:#ff6b6b}.term .h{color:#60a5fa}.term .y{color:#eab308}
.term input{background:none;border:0;outline:none;color:inherit;font:inherit;width:60%;caret-color:var(--accent)}

/* ===== misc apps ===== */
.pad{padding:24px 28px;line-height:1.8;user-select:text;-webkit-user-select:text;font-size:14px}
.pad h2{font-size:22px}
.pad .sub{color:var(--accent);font:12px var(--mono);margin:2px 0 16px}
.pad ul{padding-left:20px}
.pad a{color:var(--accent)}
.tool{padding:16px;display:flex;flex-direction:column;gap:10px;height:100%}
.tool textarea{flex:1;min-height:70px;background:var(--code);border:.5px solid var(--line);border-radius:8px;color:var(--text);font:12.5px var(--mono);padding:10px;resize:none;outline:none}
.tool textarea:focus{box-shadow:0 0 0 3px rgba(var(--accent-rgb),.35)}
.btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{padding:4px 12px;border-radius:6px;background:var(--hover);border:.5px solid var(--line);font-size:12.5px}
.btn:hover{filter:brightness(1.25)}
.btn.pri{background:var(--accent);color:#04110d;border-color:transparent;font-weight:600}
.prefs{display:flex;height:100%}
.prefs aside{width:170px;background:var(--side);padding:12px 8px;border-right:.5px solid var(--line)}
.prefs aside button{display:flex;gap:8px;align-items:center;width:100%;padding:5px 8px;border-radius:6px;text-align:left}
.prefs aside button.on{background:var(--accent);color:#04110d}
.prefs .pane{flex:1;padding:22px;overflow:auto}
.prefs h3{font-size:13px;margin-bottom:10px}
.card{background:var(--hover);border-radius:10px;padding:14px;margin-bottom:16px}
.swatches{display:flex;gap:10px}
.sw{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.sw.on{box-shadow:0 0 0 2px var(--win-solid),0 0 0 4px currentColor}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
.choice{text-align:center;font-size:12px}
.choice .pv{height:62px;border-radius:8px;margin-bottom:5px;border:3px solid transparent;overflow:hidden}
.choice.on .pv{border-color:var(--accent)}
.src{font:12px/1.6 var(--mono);padding:10px 0;user-select:text;-webkit-user-select:text;counter-reset:l}
.src div{white-space:pre-wrap;word-break:break-all;padding-left:56px;position:relative}
.src div::before{counter-increment:l;content:counter(l);position:absolute;left:0;width:44px;text-align:right;color:var(--muted);opacity:.6}

/* ===== spotlight ===== */
#spot{position:fixed;left:50%;top:22%;transform:translateX(-50%);width:min(640px,92vw);background:var(--menu);border:.5px solid var(--line);border-radius:14px;box-shadow:0 30px 90px rgba(0,0,0,.5);z-index:9700;display:none;overflow:hidden}
#spot.open{display:block;animation:open .15s ease-out}
#spot .in{display:flex;align-items:center;gap:12px;padding:12px 16px}
#spot input{flex:1;background:none;border:0;outline:none;color:var(--text);font:22px var(--font)}
#spot .res{max-height:360px;overflow:auto;border-top:.5px solid var(--line);padding:6px}
#spot .res:empty{display:none}
#spot .res h6{font-size:11px;color:var(--muted);margin:6px 10px 2px;font-weight:600}
#spot .r{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:7px}
#spot .r.on{background:var(--accent);color:#04110d}
#spot .r .ri{width:26px;height:26px;flex:none}
#spot .r small{display:block;opacity:.65;font-size:11px}

/* ===== notifications / widgets ===== */
#notes{position:fixed;top:calc(var(--menubar) + 10px);right:10px;display:flex;flex-direction:column;gap:8px;z-index:9800;width:340px;max-width:calc(100vw - 20px)}
.note{display:flex;gap:10px;padding:11px 13px;border-radius:14px;background:var(--menu);border:.5px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.3);animation:slide .3s cubic-bezier(.2,.8,.2,1);font-size:12.5px}
.note b{display:block;font-size:13px}
.note .ni{width:32px;height:32px;flex:none}
@keyframes slide{from{transform:translateX(110%)}}
.note.out{transition:.25s;transform:translateX(110%);opacity:0}
#cc{right:8px;width:320px;padding:12px}
#cc .tile{background:var(--hover);border-radius:12px;padding:12px;margin-bottom:10px}
#cc .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#cc .tg{display:flex;align-items:center;gap:10px;padding:4px 0}
#cc .tg .c{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--hover)}
#cc .tg.on .c{background:var(--accent);color:#04110d}
#cc input[type=range]{width:100%;accent-color:var(--accent)}
#calpop{right:8px;width:290px;padding:14px}
#calpop table{width:100%;text-align:center;border-collapse:collapse;font-size:12px}
#calpop th{color:var(--muted);font-weight:500;padding:3px 0}
#calpop td{padding:5px 0}#calpop td.o{opacity:.3}
#calpop td.t span{background:#ff5f57;color:#fff;border-radius:50%;display:inline-block;width:22px;height:22px;line-height:22px;font-weight:700}
#boot{position:fixed;inset:0;background:#000;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;transition:opacity .5s}
#boot .bar{width:200px;height:5px;border-radius:3px;background:#333;overflow:hidden}
#boot .bar i{display:block;height:100%;width:0;background:#e5e5e5;animation:load 1s ease-in-out forwards}
@keyframes load{to{width:100%}}
#lock{position:fixed;inset:0;z-index:99990;display:none;flex-direction:column;align-items:center;padding-top:9vh;color:#fff;backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);background:rgba(0,0,0,.25)}
#lock.open{display:flex}
#lock .d{font-size:20px;font-weight:600;opacity:.85}
#lock .t{font-size:96px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
#lock .u{margin-top:auto;margin-bottom:12vh;text-align:center}
#lock .av{width:64px;height:64px;border-radius:50%;margin:0 auto 8px;background:linear-gradient(135deg,var(--accent),#2563eb);display:grid;place-items:center;font-size:24px;font-weight:700}
#lock .pw{margin-top:10px;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.2);font-size:12px}
@media (max-width:700px){
  #menubar .hide-m{display:none}

 {slug:"ssh-bruteforce",title:"SSH 무차별 대입 공격, 로그로 잡고 fail2ban으로 막기",date:"2026-11-18",cat:"Blue Team",tags:["Linux","SSH","탐지"],read:6,body:`
서버를 퍼블릭 IP로 열어두면 몇 분 안에 <code>sshd</code> 로그가 실패 기록으로 가득 찹니다. 대부분은 자동화된 봇이지만, 패턴을 읽을 줄 알면 방어 규칙을 훨씬 정확하게 만들 수 있습니다.
## 1. 로그에서 공격 흔적 찾기
<pre><code>sudo grep "Failed password" /var/log/auth.log \\
  | awk '{print $(NF-3)}' | sort | uniq -c | sort -rn | head</code></pre>
IP별 실패 횟수를 세면 상위 몇 개 대역이 전체 시도의 대부분을 차지하는 경우가 많습니다.
## 2. fail2ban 기본 설정
<pre><code>[sshd]
enabled  = true
maxretry = 5
findtime = 10m
bantime  = 1h</code></pre>
> bantime을 무작정 늘리기보다 <code>bantime.increment = true</code>로 재범 IP에만 점점 길게 거는 편이 운영상 안전합니다.
## 3. 근본 대책
- 비밀번호 로그인 끄기: <code>PasswordAuthentication no</code>
- root 직접 로그인 금지: <code>PermitRootLogin no</code>
- 키 기반 인증 + 필요하면 접속 IP 제한
fail2ban은 소음을 줄여주는 도구일 뿐, 인증 방식 자체를 강하게 만드는 게 먼저입니다.`},
 {slug:"honeypot-intro",title:"허니팟으로 공격자 행동 관찰하기 — Cowrie 입문",date:"2026-11-10",cat:"Research",tags:["Honeypot","Cowrie","위협 인텔"],read:8,body:`
허니팟은 일부러 '공격받기 위해' 띄워두는 미끼 시스템입니다. 실제 서비스와 분리해 두고, 들어오는 공격자의 명령·다운로드 파일·접속 경로를 기록합니다.
## 왜 쓰나
- 실제 환경에 오기 전에 공격 트렌드를 먼저 파악
- 수집한 IP·해시로 차단 목록과 탐지 룰을 보강
- 로그 데이터를 대시보드로 시각화해 학습 자료로 활용
## Cowrie 빠르게 띄우기
<pre><code>docker run -d -p 2222:2222 cowrie/cowrie
# 22번 포트를 2222로 포워딩 (실서비스 sshd는 다른 포트로 이동)
sudo iptables -t nat -A PREROUTING -p tcp --dport 22 -j REDIRECT --to-port 2222</code></pre>
## 관찰 포인트
접속 직후 공격자들이 거의 공통으로 치는 명령이 있습니다: <code>uname -a</code>, <code>cat /proc/cpuinfo</code>, 그리고 마이너 다운로드 시도. 이 순서 자체가 봇의 지문이 됩니다.
> 허니팟은 반드시 격리된 네트워크에 두세요. 탈취당한 허니팟이 다른 곳을 공격하는 발판이 되면 안 됩니다.`},
 {slug:"xss-basics",title:"XSS 다시 보기: 반사형, 저장형, DOM 기반의 차이",date:"2026-10-29",cat:"Web",tags:["XSS","OWASP","프론트엔드"],read:7,body:`
XSS는 '사용자 입력이 코드로 해석되는' 문제입니다. 종류마다 입력이 어디로 들어가서 어디서 실행되는지가 다릅니다.
## 세 가지 유형
- <b>반사형</b>: 요청 파라미터가 응답에 그대로 반사됨. 피해자가 조작된 링크를 클릭해야 함
- <b>저장형</b>: 게시글·댓글처럼 서버에 저장된 입력이 다른 사용자에게 노출됨. 파급력이 가장 큼
- <b>DOM 기반</b>: 서버를 거치지 않고 클라이언트 JS가 <code>location.hash</code> 등을 위험한 싱크에 넣음
## 위험한 싱크 예시
<pre><code>el.innerHTML = location.hash.slice(1);   // ❌
el.textContent = location.hash.slice(1); // ✅</code></pre>
## 방어 체크리스트
- 출력 위치(HTML/속성/JS/URL)에 맞는 인코딩
- 프레임워크 기본 이스케이프를 우회하는 API(<code>dangerouslySetInnerHTML</code>, <code>v-html</code>) 사용 최소화
- CSP로 인라인 스크립트 실행 제한
- 세션 쿠키에 <code>HttpOnly</code>
> 이 글의 코드는 학습용입니다. 허가받지 않은 시스템에 테스트하지 마세요.`},
 {slug:"jwt-pitfalls",title:"JWT를 쓸 때 자주 하는 실수 5가지",date:"2026-10-15",cat:"Web",tags:["JWT","인증","API"],read:5,body:`
JWT는 편하지만, '서명된 JSON'이라는 본질을 잊으면 쉽게 구멍이 생깁니다.
## 1. alg 헤더를 믿는다
서버는 허용 알고리즘을 고정해야 합니다. 헤더의 <code>alg</code>를 그대로 따르면 <code>none</code> 또는 알고리즘 혼동 공격에 노출됩니다.
<pre><code>jwt.verify(token, key, { algorithms: ["RS256"] });</code></pre>
## 2. 페이로드에 민감 정보를 넣는다
JWT는 암호화가 아니라 Base64URL 인코딩입니다. 누구나 디코딩할 수 있습니다.
## 3. 만료가 너무 길다
액세스 토큰은 짧게, 리프레시 토큰은 회전(rotation)과 폐기 목록으로 관리하세요.
## 4. 약한 HMAC 시크릿
짧은 시크릿은 오프라인 크래킹 대상이 됩니다. 충분히 긴 랜덤 값을 쓰세요.
## 5. 로그아웃을 구현하지 않는다
상태가 없는 토큰이라도 서버 측 무효화 수단(블랙리스트, 토큰 버전)은 필요합니다.`},
 {slug:"ctf-web-routine",title:"CTF 웹 문제를 만났을 때 내 첫 10분 루틴",date:"2026-09-30",cat:"CTF",tags:["CTF","Recon","Writeup"],read:4,body:`
웹 문제는 처음 10분의 정찰이 풀이 시간을 크게 좌우합니다. 제가 매번 같은 순서로 확인하는 것들입니다.
## 체크 순서
- 페이지 소스와 주석, 로드되는 JS 파일 훑기
- <code>/robots.txt</code>, <code>/.git/</code>, 백업 파일(<code>.bak</code>, <code>~</code>) 확인
- 쿠키·세션 값 디코딩 (Base64, JWT 여부)
- 입력 지점마다 따옴표, <code>{{7*7}}</code>, <code>../</code> 같은 기본 페이로드로 반응 보기
- 응답 헤더로 서버/프레임워크 버전 파악
## 도구
<pre><code>curl -i http://chall.local/
ffuf -u http://chall.local/FUZZ -w common.txt</code></pre>
> 정찰 결과는 바로 메모하세요. 막혔을 때 되돌아볼 근거가 됩니다.`}

const fmtClock=new Intl.DateTimeFormat("ko-KR",{month:"long",day:"numeric",weekday:"short",hour:"numeric",minute:"2-digit"});
let lastMin=-1;const tick=()=>{const d=new Date();if(d.getMinutes()!==lastMin||$("#lock").classList.contains("open")){lastMin=d.getMinutes();$("#mbClock").textContent=fmtClock.format(d).replace(/,/g,"");
 if($("#lock").classList.contains("open")){$("#lock .d").textContent=d.toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"long"});$("#lock .t").textContent=d.toLocaleTimeString("ko-KR",{hour:"numeric",minute:"2-digit",hour12:false})}}};
tick();setInterval(tick,1000);
let calOff=0;function drawCal(){const n=new Date(),v=new Date(n.getFullYear(),n.getMonth()+calOff,1),c=$("#calpop");
 const first=v.getDay(),days=new Date(v.getFullYear(),v.getMonth()+1,0).getDate(),prev=new Date(v.getFullYear(),v.getMonth(),0).getDate(),cells=[];
 const ym=`${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,"0")}`,postDays=new Set(POSTS.filter(p=>p.date.startsWith(ym)).map(p=>+p.date.slice(8)));
 for(let i=first-1;i>=0;i--)cells.push(`<td class="o">${prev-i}</td>`);for(let d=1;d<=days;d++)cells.push(`<td class="${calOff===0&&d===n.getDate()?"t":""}"><span ${postDays.has(d)?'style="box-shadow:inset 0 -2px 0 var(--accent)"':""}>${d}</span></td>`);let k=1;while(cells.length%7)cells.push(`<td class="o">${k++}</td>`);
 let rows="";for(let i=0;i<cells.length;i+=7)rows+="<tr>"+cells.slice(i,i+7).join("")+"</tr>";const posted=POSTS.filter(p=>p.date.startsWith(ym));
 c.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b style="color:#ff5f57">${v.getFullYear()}년 ${v.getMonth()+1}월</b><span><button class="tbtn" data-m="-1" aria-label="이전 달">‹</button><button class="tbtn" data-m="1" aria-label="다음 달">›</button></span></div><table><tr>${"일월화수목금토".split("").map(d=>`<th>${d}</th>`).join("")}</tr>${rows}</table>
  <div style="margin-top:10px;border-top:.5px solid var(--line);padding-top:8px;font-size:12px"><div style="color:var(--muted);margin-bottom:4px">이 달에 쓴 글 ${posted.length}편</div>${posted.map(p=>`<button class="tbtn" style="display:block;width:100%;text-align:left;padding:3px 6px;height:auto;color:var(--text)" data-s="${p.slug}">• ${esc(p.title)}</button>`).join("")}</div>`}
$("#calpop").addEventListener("click",e=>{const m=e.target.closest("[data-m]");if(m){calOff+=+m.dataset.m;return drawCal()}const s=e.target.closest("[data-s]");if(s){closePops();openPost(s.dataset.s)}});
$("#mbClock").onclick=e=>{e.stopPropagation();const c=$("#calpop"),o=c.classList.contains("open");closePops();if(!o){calOff=0;drawCal();c.classList.add("open")}};
const SV={moon:'<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>',wifi:'<svg width="14" height="12" viewBox="0 0 24 18" fill="currentColor"><path d="M12 18l3.5-4.2a5.5 5.5 0 00-7 0zM12 9.5a10 10 0 016.4 2.3l2-2.4a13 13 0 00-16.8 0l2 2.4A10 10 0 0112 9.5z"/></svg>',half:'<svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 010 18z" fill="currentColor"/></svg>',lock:'<svg width="13" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>'};
function drawCC(){const c=$("#cc"),dark=document.body.dataset.theme==="dark";
 c.innerHTML=`<div class="row2"><div class="tile"><button class="tg ${DND?"on":""}" data-cc="dnd"><span class="c">${SV.moon}</span><div style="text-align:left"><b>방해 금지</b><br><small style="color:var(--muted)">${DND?"켬":"끔"}</small></div></button><div class="tg on"><span class="c">${SV.wifi}</span><div><b>Wi-Fi</b><br><small style="color:var(--muted)">TSK-SEC</small></div></div></div>
  <div class="tile"><button class="tg ${dark?"on":""}" data-cc="dark"><span class="c">${SV.half}</span><div style="text-align:left"><b>다크 모드</b><br><small style="color:var(--muted)">${dark?"켬":"끔"}</small></div></button><button class="tg" data-cc="lock"><span class="c">${SV.lock}</span><div style="text-align:left"><b>화면 잠금</b></div></button></div></div>
  <div class="tile"><b>배경화면</b><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${Object.entries(WALLS).map(([k,v])=>`<button class="btn ${wp===k?"pri":""}" data-w="${k}">${v}</button>`).join("")}</div></div>
  <div class="tile"><b>블로그 통계</b><div style="font-size:12px;color:var(--muted);margin-top:6px">글 ${POSTS.length}편 · 태그 ${new Set(POSTS.flatMap(p=>p.tags)).size}개 · 최근 업데이트 ${latest()?.date||"—"}</div></div>`}
$("#cc").addEventListener("click",e=>{const b=e.target.closest("[data-cc],[data-w]");if(!b)return;if(b.dataset.cc==="dnd"){DND=!DND;store.set("dnd",DND)}else if(b.dataset.cc==="dark")setTheme(document.body.dataset.theme==="dark"?"light":"dark");else if(b.dataset.cc==="lock"){closePops();return lock()}else setWall(b.dataset.w);drawCC()});
$("#mbCC").onclick=e=>{e.stopPropagation();const c=$("#cc"),o=c.classList.contains("open");closePops();if(!o){drawCC();c.classList.add("open")}};
/* 실제 배터리 (Battery Status API 지원 브라우저만) */
(async()=>{try{if(!navigator.getBattery)return;const b=await navigator.getBattery();const up=()=>{const p=Math.round(b.level*100);$("#batPct").textContent=p+"%";$("#batFill").setAttribute("width",Math.max(1,19*b.level));$("#batFill").setAttribute("fill",p<=20&&!b.charging?"#ff5f57":"currentColor");$("#mbBat").title=`배터리 ${p}%${b.charging?" (충전 중)":""}`};up();b.addEventListener("levelchange",up);b.addEventListener("chargingchange",up)}catch{}})();
function lock(){const l=$("#lock");l.classList.add("open");lastMin=-1;tick();const un=()=>{l.classList.remove("open");removeEventListener("keydown",un);l.onclick=null};l.onclick=un;setTimeout(()=>addEventListener("keydown",un),50)}

/* =========================================================
   13. TISTORY ADAPTER — 티스토리 스킨에 들어가면 RSS와 현재 페이지에서 글을 자동으로 읽음
   ========================================================= */
const normDate=s=>{const m=String(s||"").match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);return m?`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`:""};
function mkPost({link,title,date,cat,tags=[],html=""}){const u=new URL(link,location.href),seg=decodeURIComponent(u.pathname.split("/").filter(Boolean).pop()||"post");
 const tmp=document.createElement("div");tmp.innerHTML=html;const img=tmp.querySelector("img[src]");const len=tmp.textContent.replace(/\s+/g,"").length;
 return{slug:decodeURI(u.pathname),file:seg.replace(/\s+/g,"-")+".md",link:u.href,title:title||"(제목 없음)",date:normDate(date)||date||"",cat:cat||"미분류",tags,html,thumb:img?img.getAttribute("src"):null,read:Math.max(1,Math.round(len/500))}}
const samePath=(a,b)=>{try{return decodeURI(new URL(a,location.href).pathname)===decodeURI(new URL(b,location.href).pathname)}catch{return false}};
async function loadTistory(){
 const tx=(el,s)=>el?.querySelector(s)?.textContent.trim()||"";const bl=TT.querySelector("#tt-blog");BLOG.title=tx(TT,"#tt-blog .tt-bt")||BLOG.title;BLOG.desc=tx(TT,"#tt-blog .tt-bd")||BLOG.desc;BLOG.link=bl?.dataset.link||location.origin+"/";BLOG.host=location.host;
 INITIAL={type:document.body.id,conform:tx(TT,"#tt-list .tt-conform")};
 let list=[];
 /* 1) RSS: 같은 도메인이라 CORS 문제 없음. 실패해도 아래 대체 경로로 동작 */
 try{const ctl=new AbortController();setTimeout(()=>ctl.abort(),4000);
  const r=await fetch(new URL("rss",BLOG.link.replace(/\/?$/,"/")),{signal:ctl.signal,credentials:"same-origin"});
  if(r.ok){const x=new DOMParser().parseFromString(await r.text(),"text/xml");
   list=[...x.querySelectorAll("item")].map(it=>{const cats=[...it.querySelectorAll("category")].map(c=>c.textContent.trim()).filter(Boolean);const pd=new Date(it.querySelector("pubDate")?.textContent||"");
    return mkPost({link:it.querySelector("link")?.textContent.trim()||"/",title:it.querySelector("title")?.textContent.trim(),date:isNaN(pd)?"":`${pd.getFullYear()}-${String(pd.getMonth()+1).padStart(2,"0")}-${String(pd.getDate()).padStart(2,"0")}`,cat:cats[0],tags:cats.slice(1),html:it.querySelector("description")?.textContent||""})})}}catch{}
 /* 2) 홈·목록 페이지에 서버가 그려준 글 목록 (RSS가 꺼져 있을 때 대체) */
 TT.querySelectorAll(".tt-item").forEach(a=>{if(!list.some(p=>samePath(p.link,a.getAttribute("href"))))list.push(mkPost({link:a.getAttribute("href"),title:tx(a,".tt-t"),date:tx(a,".tt-d"),cat:tx(a,".tt-c"),html:a.querySelector(".tt-s")?.innerHTML||""}))});
 /* 3) 지금 보고 있는 글(퍼머링크): 본문+댓글 DOM을 그대로 창 안으로 옮김 */
 const art=TT.querySelector(".tt-article");
 if(art){let p=list.find(x=>samePath(x.link,art.dataset.link));
  if(!p){p=mkPost({link:art.dataset.link||location.href,title:tx(art,".tt-head .tt-t"),date:tx(art,".tt-head .tt-d"),cat:tx(art,".tt-head .tt-c")});list.unshift(p)}
  p.html=art.querySelector(".tt-desc")?.innerHTML||p.html;{const dt=[...art.querySelectorAll(".tt-tags a")].map(a=>a.textContent.trim()).filter(Boolean);if(dt.length)p.tags=dt}
  const tmp=document.createElement("div");tmp.innerHTML=p.html;p.read=Math.max(1,Math.round(tmp.textContent.replace(/\s+/g,"").length/500));p.sum=null;
  art.querySelector(".tt-head")?.remove();p.node=art;CURRENT=p.slug}
 POSTS=list;WRITEUPS=[];}

/* =========================================================
   14. BOOT — 첫 방문만 부팅 로그, 재방문은 즉시 (건너뛰기 가능)
   ========================================================= */
{const a=store.get("accent");setAccent(a||"#0a84ff");const t=store.get("theme");if(t)document.body.dataset.theme=t}
resize();buildDock();syncMenu();
addEventListener("resize",debounce(()=>{layoutIcons();if(mobile())WM.wins.forEach(w=>w.el.classList.add("max"))},150));
if(!TT)addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(POSTS.some(p=>p.slug===h))openPost(h)});
const FEED=document.documentElement.dataset.feed;
/* GitHub Pages 등 외부 호스팅: GitHub Actions가 티스토리 RSS를 posts.json으로 저장해 두면 그걸 읽음 */
async function loadFeed(){try{const r=await fetch(FEED,{cache:"no-cache"});const d=await r.json();if(d.blog){BLOG.title=d.blog.title||BLOG.title;BLOG.desc=d.blog.desc||BLOG.desc;BLOG.link=d.blog.link||BLOG.link}
 POSTS=(d.posts||[]).map(it=>Object.assign(mkPost({link:it.link,title:it.title,date:it.date,cat:(it.categories||[])[0],tags:(it.categories||[]).slice(1),html:it.html||""}),{ext:true,full:it.full!==false}))}catch{POSTS=[]}WRITEUPS=[];BLOG.host=location.host}
const ready=(TT?loadTistory():FEED?loadFeed():Promise.resolve()).then(()=>{FS=buildFS();buildIndex();layoutIcons();const ht=$("#hero .ttl");if(ht&&!ht.dataset.fixed)ht.textContent=BLOG.title;setupHero()});
function startDesktop(){const sess=store.get("session",[]);
 sess.forEach(s=>{if(!APPS[s.app]||(s.app==="project"&&!PROJECTS.some(p=>p.id===s.arg?.id)))return;if(s.app==="blog"&&s.arg?.slug&&!findPost(s.arg.slug))s.arg={};const id=openApp(s.app,s.arg||{},s);if(s.min)minimize(id)});
 const h=TT?CURRENT:decodeURIComponent(location.hash.slice(1));
 if(h&&findPost(h))return openPost(findPost(h).slug);
 if(TT&&/category|tag/.test(INITIAL.type)&&INITIAL.conform)return openApp("blog",{filter:INITIAL.conform});
 if(TT&&INITIAL.type==="tt-body-search"&&INITIAL.conform){openSpot();const i=$("#spot input");i.value=INITIAL.conform;return drawSpot()}
 if(!sess.length){openApp("finder",{path:["posts"]});setTimeout(()=>notify(`${esc(BLOG.title)}에 오신 걸 환영합니다`,"<b style='display:inline'>⌘/Ctrl+K</b>로 검색하고, 아이콘을 더블클릭해 둘러보세요."),500)}}
(()=>{const boot=$("#boot"),log=boot.querySelector(".bootlog"),first=(()=>{try{return !sessionStorage.getItem("tsk3-booted")}catch{return true}})();let done=false;
 const finish=async()=>{if(done)return;done=true;try{sessionStorage.setItem("tsk3-booted","1")}catch{}removeEventListener("keydown",finish);await ready;boot.style.opacity=0;setTimeout(()=>boot.remove(),400);startDesktop()};
 boot.addEventListener("click",finish);addEventListener("keydown",finish);
 if(!first||reduceMotion){boot.querySelector(".bar i").style.animationDuration=".3s";return setTimeout(finish,300)}
 const steps=["Waking up","Brewing coffee","Mounting /home/tsk","Loading posts","Arranging desktop icons","Ready"];
 steps.forEach((s,i)=>setTimeout(()=>{if(!done)log.insertAdjacentHTML("beforeend",`<div><span class="ok">[  OK  ]</span> ${s}</div>`)},i*160));setTimeout(finish,steps.length*160+250)})();
</script>
